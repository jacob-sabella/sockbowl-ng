name: Angular CI with Docker

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        # 20.x reached end-of-life 2026-04-30; 24.x is the current active LTS
        # (matches package.json's engines range and ships npm 11 already, so
        # the old "pin npm to 11" workaround below is no longer needed).
        node-version: [24.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Install Angular CLI
        run: npm install -g @angular/cli

      - name: Run unit tests
        run: npm test -- --watch=false --browsers=ChromeHeadlessCI

      - name: Build Angular project
        run: npm run buildprod

      # Docker steps
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and tag Docker image
        run: |
          BRANCH_NAME=$(echo "${GITHUB_REF##*/}")
          docker build -t ghcr.io/${{ github.repository }}:${BRANCH_NAME} .

      - name: Push Docker image
        run: |
          BRANCH_NAME=$(echo "${GITHUB_REF##*/}")
          docker push ghcr.io/${{ github.repository }}:${BRANCH_NAME}

