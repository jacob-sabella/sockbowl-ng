name: Angular CI with Docker

on:
  push:
    branches: [ "main", "goal/**", "release/**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        # 20.x reached end-of-life 2026-04-30; 24.x is the current active LTS
        # (matches package.json's engines range and ships npm 11 already, so
        # the old "pin npm to 11" workaround below is no longer needed).
        node-version: [24.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm test -- --watch=false --browsers=ChromeHeadlessCI

      - name: Build Angular project
        run: npm run buildprod

      - name: Security headers acceptance test
        run: npm run test:headers

      # Docker steps
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Build and tag Docker image
        run: |
          BRANCH_NAME="${GITHUB_REF##*/}"
          docker build -t "ghcr.io/${{ github.repository }}:${BRANCH_NAME}" .

      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        run: |
          BRANCH_NAME="${GITHUB_REF##*/}"
          docker push "ghcr.io/${{ github.repository }}:${BRANCH_NAME}"

          # Immutable per-commit tag for the deploy job (main only).
          if [ "${{ github.ref_name }}" == "main" ]; then
            SHA_TAG="ghcr.io/${{ github.repository }}:sha-${{ github.sha }}"
            docker tag "ghcr.io/${{ github.repository }}:${BRANCH_NAME}" "${SHA_TAG}"
            docker push "${SHA_TAG}"
          fi

  # Continuous deployment: after the image for this commit is published, ask
  # the prod host to switch ng to it. The key is restricted by a forced
  # command (sockbowl-docker scripts/deploy/ssh-deploy-gate.sh) to exactly
  # `deploy <service> <sha>`; the host pulls the sha-<sha> image, waits for
  # the healthcheck, and rolls back to the previous image if it fails.
  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: prod-deploy-ng
      cancel-in-progress: false
    steps:
      - name: Deploy to production
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$DEPLOY_HOST" "deploy ng ${GITHUB_SHA}"
