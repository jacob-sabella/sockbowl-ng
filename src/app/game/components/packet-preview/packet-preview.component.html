<div class="preview">
  <div class="preview__head">
    <div class="preview__headings">
      <div class="preview__eyebrow"><mat-icon>visibility</mat-icon> Packet preview · proctor only</div>
      <h2 class="preview__title">{{ packet?.name || 'Packet' }}</h2>
      <div class="preview__meta">{{ tossupCount }} tossups · {{ bonusCount }} bonuses</div>
    </div>
    <button mat-icon-button (click)="close()" aria-label="Close preview">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <mat-dialog-content class="preview__body">
    <app-packet-reading-view [packet]="packet"></app-packet-reading-view>
  </mat-dialog-content>
</div>
