<div class="empty-state">
  @if (icon) {
    <mat-icon class="empty-state__icon" aria-hidden="true">{{ icon }}</mat-icon>
  }
  <p class="empty-state__title">{{ title }}</p>
  @if (message) {
    <p class="empty-state__message">{{ message }}</p>
  }
  @if (actionLabel) {
    <button
      class="empty-state__action"
      mat-stroked-button
      type="button"
      (click)="action.emit()"
    >
      {{ actionLabel }}
    </button>
  }
</div>
