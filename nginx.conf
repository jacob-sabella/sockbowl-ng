server {
    listen       80;
    server_name  localhost;
    root   /usr/share/nginx/html;
    index  index.html index.htm;

    # Security headers (CSP + friends, AUTH-21), rendered per-deploy from
    # security-headers.conf.template by docker-entrypoint.sh. `add_header` in a
    # location block replaces (rather than merges with) whatever the server
    # block would otherwise contribute, and every location below already sets
    # its own `add_header Cache-Control`, so the snippet is included in each
    # location individually instead of once at the server level.

    # PWA: serve the web app manifest with the correct media type.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # PWA: the service worker, its config, and the app shell must always be
    # revalidated so a new deploy rolls out promptly instead of being pinned
    # to a stale cached copy (Angular ngsw guidance).
    location = /ngsw-worker.js   { add_header Cache-Control "no-cache"; include /etc/nginx/snippets/security-headers.conf; }
    location = /ngsw.json        { add_header Cache-Control "no-cache"; include /etc/nginx/snippets/security-headers.conf; }
    location = /safety-worker.js { add_header Cache-Control "no-cache"; include /etc/nginx/snippets/security-headers.conf; }
    location = /index.html       { add_header Cache-Control "no-cache"; include /etc/nginx/snippets/security-headers.conf; }

    # Runtime environment config is generated per-deploy (docker-entrypoint.sh);
    # it must never be cached or the SPA could boot against stale URLs.
    location = /assets/config.js { add_header Cache-Control "no-cache"; include /etc/nginx/snippets/security-headers.conf; }

    # SPA fallback for client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
        include /etc/nginx/snippets/security-headers.conf;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
        include /etc/nginx/snippets/security-headers.conf;
    }
}
